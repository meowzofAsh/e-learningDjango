{% extends "base.html" %}
{% load static %}

{% block content %}
<header class="site-header d-flex flex-column justify-content-center align-items-center">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-5 col-12">
                <h2 class="text-white">Rejoignez-nous</h2>
            </div>
        </div>
    </div>
</header>

<section class="section-padding section-bg">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-10 col-12">
                
                <form action="#" method="post" class="custom-form contact-form bg-white shadow-lg" role="form">
                    {% csrf_token %}
                    
                    <h3 class="mb-4 text-center">Créer un compte</h3>

                    <div class="row">
                        {% for field in form %}
                        <div class="col-12 mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            <div class="form-control-wrapper">
                                {{ field }}
                            </div>
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}

                        <div class="col-lg-12 col-12 mt-3">
                            <button type="submit" class="form-control">S'inscrire maintenant</button>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </div>
</section>

<style>
    .contact-form input {
        border-radius: 20px;
        padding: 12px 20px;
        border: 1px solid #eee;
        width: 100%;
        margin-bottom: 10px;
    }
    .contact-form ul { 
        list-style: none; 
        color: #717275;
        font-size: 0.8rem;
        padding-left: 0;
    }
</style>
{% endblock %}
